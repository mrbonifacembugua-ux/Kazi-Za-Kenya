name: Apply homepage button routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route action buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='''  function needSomething() {
    alert(
      "The job posting system will let you describe the work, add up to 5 photos, choose your location, set your budget and receive responses from nearby workers."
    );
  }'''
          new='''  function needSomething() {
    router.push("/need-service");
  }'''
          if old in s:
            s=s.replace(old,new,1)
          old='''  function offerService() {
    alert(
      "Provider registration will allow you to create your profile, add your services, price, location, availability, up to 7 proof-of-work photos and work evidence."
    );
  }'''
          new='''  function offerService() {
    router.push("/offer-service");
  }'''
          if old in s:
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-photo-slots-fix.yml .github/photo-fix-trigger.txt
          git add app/page.tsx .github/workflows/apply-photo-slots-fix.yml .github/photo-fix-trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Activate service action buttons"
          git push